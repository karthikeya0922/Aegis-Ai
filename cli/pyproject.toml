[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-cli"
version = "0.1.0"
description = "Aegis from the terminal: pre-commit secret/PII scanning and guarded chat through the Aegis Gateway."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
]

[project.scripts]
aegis = "aegis_cli.app:main"

[tool.setuptools.packages.find]
include = ["aegis_cli*"]
