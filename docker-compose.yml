# Aegis -- full stack.
#
#   docker compose up --build            # gateway + inspector (ml image) + redis-stack + postgres
#   docker compose --profile lite up     # inspector base image, SQLite, no models
#
# The gateway (Next.js, Person 2) proxies /api/v1/chat/completions through the
# inspector; the inspector never talks to Redis -- semantic cache, rate limiter
# state and circuit breakers are the gateway's (see backend/app/hardening.py).

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis-stack:6379
      AEGIS_ENGINE_URL: http://inspector:8000
      AEGIS_SCAN_TIMEOUT_MS: ${AEGIS_SCAN_TIMEOUT_MS:-3000}
      AEGIS_VERIFY_TIMEOUT_MS: ${AEGIS_VERIFY_TIMEOUT_MS:-3000}
      GLM_API_KEY: ${GLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      AEGIS_PROVIDER_HOST_ALLOWLIST: ${AEGIS_PROVIDER_HOST_ALLOWLIST:-}
      AEGIS_PROVIDER_ALLOW_PRIVATE_IPS: ${AEGIS_PROVIDER_ALLOW_PRIVATE_IPS:-false}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      redis-stack:
        condition: service_started
      inspector:
        condition: service_healthy

  inspector:
    build:
      context: ./backend
      target: ml
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:aegis@postgres:5432/aegis
      AEGIS_USER_HASH_SALT: ${AEGIS_USER_HASH_SALT:?set a long random value in .env}
      AEGIS_ADMIN_TOKEN: ${AEGIS_ADMIN_TOKEN:-}
      AEGIS_REVIEWER_TOKEN: ${AEGIS_REVIEWER_TOKEN:-}
      AEGIS_CORS_ORIGINS: ${AEGIS_CORS_ORIGINS:-http://localhost:3000}
      AEGIS_WARM_MODELS: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3

  inspector-lite:
    profiles: ["lite"]
    build:
      context: ./backend
      target: base
    environment:
      AEGIS_USER_HASH_SALT: ${AEGIS_USER_HASH_SALT:-dev-only-salt}
    volumes:
      - inspector-data:/srv/data
    ports:
      - "8000:8000"

  # Redis Stack (RediSearch) for the gateway's semantic cache and breaker state.
  redis-stack:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
  postgres_data:
  inspector-data:
