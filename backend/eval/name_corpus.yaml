# Fairness evaluation corpus for the PERSON detector.
#
# Five name-origin groups, 60 full names each, every name run through the
# SAME sentence templates. Recall is measured per group; the gap between the
# best- and worst-served group is the number that matters.
#
# Honesty constraints on this corpus:
#
#   * The Indian group is NOT a copy of config/india_names.yaml. Roughly half
#     the Indian names have a first or last name in the gazetteer and half
#     have neither, and the harness reports both subsets separately. Measuring
#     the gazetteer only on names it contains would be circular.
#   * The East Asian group includes ten hyphenated Korean given names
#     (Min-jun, Ji-woo) on purpose. The capitalised-token patterns do not
#     handle hyphens, and the corpus should surface that rather than avoid it.
#   * This is a fixed synthetic corpus, not a representative population
#     sample. It is indicative of relative detector behaviour across groups,
#     not an absolute accuracy claim. The API response says so.
#
# Templates use {name} once. They are ordinary workplace sentences; nothing
# about them signals "a name follows" beyond what any prompt would.

version: 1
detector: pii.person

templates:
  - "Contact {name} about the invoice."
  - "Please forward this to {name} by Friday."
  - "{name} submitted the form yesterday."
  - "The meeting with {name} is at 3pm."
  - "Can you ask {name} to review the draft?"
  - "I spoke to {name} about the delivery."

