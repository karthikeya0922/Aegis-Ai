# Aegis Inspector -- Alembic configuration.
#
# Development uses create_all at startup (idempotent, SQLite). Deployments
# that need controlled upgrades run:
#
#     alembic upgrade head
#
# The URL is read from DATABASE_URL by migrations/env.py; the value below is
# only a placeholder so `alembic` commands work without an environment.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///./aegis.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
