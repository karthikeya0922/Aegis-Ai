# Indian name gazetteer.
#
# Why this exists: stock spaCy NER, trained mostly on Western news text,
# tags "John Smith" as PERSON and misses "Priya Ramaswamy" in the identical
# sentence (measured in Phase 2). A privacy tool that protects some people's
# names more reliably than others is an unfair system. This list lifts recall
# on Indian names to close that gap; the fairness harness (Phase 13) measures
# how much.
#
# Coverage is deliberately broad across regions and communities -- North,
# South, East, West, Muslim, Sikh, Christian and Parsi Indian names -- so
# the fix does not itself introduce a narrower bias. It is not exhaustive and
# never will be; it is a floor, not a ceiling.
#
# Matching rule (india_recognizers.py): a run of 2-3 capitalised tokens
# where at least one is in a list scores as PERSON. A single first name
# scores only when preceded by a contact cue ("contact", "dear", "hi", ...).
# Tokens shorter than 3 letters are ignored to keep "Om" and "Jo" from
# matching ordinary words.

