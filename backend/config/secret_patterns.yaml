# Aegis secret detection patterns.
#
# Patterns are DATA, not code. Add a provider here and the scanner picks it up
# with no source change.
#
# Fields
#   id              stable rule identifier, surfaced in the UI and audit log
#   type            detection type reported to the Gateway
#   category        the key the policy engine maps to an action (phase 6)
#   regex           Python regex; use (?P<secret>...) to mark the part that is
#                   the actual credential when it is narrower than the match
#   base_confidence starting confidence before entropy adjustment
#   entropy_weight  0.0 = prefix is definitive, ignore entropy
#                   1.0 = no distinctive prefix, entropy decides
#   min_entropy     reject the match below this (only when entropy_weight > 0)
#   placeholder     prefix for the redaction token, e.g. AWS_KEY -> [AWS_KEY_1]
#   validator       optional structural check, see secret_scanner.VALIDATORS
#
# Confidence is never asserted as certainty. A match means "this looks like a
# credential", which is why every finding carries a score rather than a bare
# boolean.

version: 1

patterns:

  # --- Cloud providers ---------------------------------------------------
  - id: aws_access_key
    type: AWS_ACCESS_KEY
    category: aws_credentials
    regex: '\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b'
    base_confidence: 0.95
    entropy_weight: 0.0
    placeholder: AWS_KEY
    description: AWS access key ID. The prefix is unambiguous.

  - id: aws_secret_key
    type: AWS_SECRET_KEY
    category: aws_credentials
    regex: '(?i)aws[_\-. ]?(?:secret|sk)[_\-. ]?(?:access)?[_\-. ]?key["''\s:=]+(?P<secret>[A-Za-z0-9/+=]{40})'
    base_confidence: 0.80
    entropy_weight: 0.6
    min_entropy: 3.5
    placeholder: AWS_SECRET
    description: AWS secret access key. No prefix, so context plus entropy.

  - id: gcp_api_key
    type: GCP_API_KEY
    category: cloud_credentials
    regex: '\bAIza[0-9A-Za-z_\-]{35}\b'
    base_confidence: 0.92
    entropy_weight: 0.0
    placeholder: GCP_KEY
    description: Google Cloud / Firebase API key.

  - id: azure_storage_key
    type: AZURE_STORAGE_KEY
    category: cloud_credentials
    regex: '(?i)(?:AccountKey|SharedAccessSignature)=(?P<secret>[A-Za-z0-9/+=]{40,})'
    base_confidence: 0.88
    entropy_weight: 0.3
    min_entropy: 3.5
    placeholder: AZURE_KEY
    description: Azure storage account key inside a connection string.

  # --- Source control ----------------------------------------------------
  - id: github_pat_classic
    type: GITHUB_TOKEN
    category: source_control_credentials
    regex: '\bghp_[A-Za-z0-9]{36}\b'
    base_confidence: 0.96
    entropy_weight: 0.0
    placeholder: GITHUB_TOKEN

  - id: github_pat_fine_grained
    type: GITHUB_TOKEN
    category: source_control_credentials
    regex: '\bgithub_pat_[A-Za-z0-9]{22}_[A-Za-z0-9]{59}\b'
    base_confidence: 0.96
    entropy_weight: 0.0
    placeholder: GITHUB_TOKEN

  - id: github_oauth
    type: GITHUB_TOKEN
    category: source_control_credentials
    regex: '\bgh[ousr]_[A-Za-z0-9]{36}\b'
    base_confidence: 0.94
    entropy_weight: 0.0
    placeholder: GITHUB_TOKEN

  - id: gitlab_pat
    type: GITLAB_TOKEN
    category: source_control_credentials
    regex: '\bglpat-[A-Za-z0-9_\-]{20}\b'
    base_confidence: 0.94
    entropy_weight: 0.0
    placeholder: GITLAB_TOKEN

  # --- AI providers ------------------------------------------------------
  - id: openai_api_key
    type: OPENAI_API_KEY
    category: ai_provider_credentials
    regex: '\bsk-(?:proj-)?[A-Za-z0-9_\-]{20,}\b'
    base_confidence: 0.90
    entropy_weight: 0.2
    min_entropy: 3.0
    placeholder: OPENAI_KEY
    description: OpenAI-style key. Also matches several look-alike providers.

  - id: anthropic_api_key
    type: ANTHROPIC_API_KEY
    category: ai_provider_credentials
    regex: '\bsk-ant-[A-Za-z0-9_\-]{20,}\b'
    base_confidence: 0.95
    entropy_weight: 0.0
    placeholder: ANTHROPIC_KEY

  - id: huggingface_token
    type: HUGGINGFACE_TOKEN
    category: ai_provider_credentials
    regex: '\bhf_[A-Za-z0-9]{34}\b'
    base_confidence: 0.92
    entropy_weight: 0.0
    placeholder: HF_TOKEN

  # --- SaaS --------------------------------------------------------------
  - id: slack_token
    type: SLACK_TOKEN
    category: saas_credentials
    regex: '\bxox[baprs]-[A-Za-z0-9\-]{10,}\b'
    base_confidence: 0.93
    entropy_weight: 0.0
    placeholder: SLACK_TOKEN

  - id: stripe_secret_key
    type: STRIPE_SECRET_KEY
    category: payment_credentials
    regex: '\b(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{20,}\b'
    base_confidence: 0.95
    entropy_weight: 0.0
    placeholder: STRIPE_KEY

  - id: sendgrid_key
    type: SENDGRID_API_KEY
    category: saas_credentials
    regex: '\bSG\.[A-Za-z0-9_\-]{22}\.[A-Za-z0-9_\-]{43}\b'
    base_confidence: 0.94
    entropy_weight: 0.0
    placeholder: SENDGRID_KEY

  - id: twilio_key
    type: TWILIO_API_KEY
    category: saas_credentials
    regex: '\bSK[0-9a-fA-F]{32}\b'
    base_confidence: 0.85
    entropy_weight: 0.3
    min_entropy: 3.0
    placeholder: TWILIO_KEY

  - id: npm_token
    type: NPM_TOKEN
    category: package_registry_credentials
    regex: '\bnpm_[A-Za-z0-9]{36}\b'
    base_confidence: 0.93
    entropy_weight: 0.0
    placeholder: NPM_TOKEN

  - id: pypi_token
    type: PYPI_TOKEN
    category: package_registry_credentials
    regex: '\bpypi-AgEIcHlwaS5vcmc[A-Za-z0-9_\-]{50,}\b'
    base_confidence: 0.95
    entropy_weight: 0.0
    placeholder: PYPI_TOKEN

  # --- Structured credentials -------------------------------------------
  - id: jwt
    type: JWT
    category: tokens
    regex: '\beyJ[A-Za-z0-9_\-]{5,}\.[A-Za-z0-9_\-]{5,}\.[A-Za-z0-9_\-]{5,}\b'
    base_confidence: 0.88
    entropy_weight: 0.1
    placeholder: JWT
    validator: jwt_structure
    description: >
      Three base64url segments. The validator decodes the header and requires
      it to parse as JSON containing an "alg" field, which rejects arbitrary
      dot-separated base64.

  - id: bearer_token
    type: BEARER_TOKEN
    category: tokens
    regex: '(?i)\bbearer\s+(?P<secret>[A-Za-z0-9_\-.=]{20,})'
    base_confidence: 0.82
    entropy_weight: 0.4
    min_entropy: 3.0
    placeholder: BEARER_TOKEN

  - id: basic_auth_header
    type: BASIC_AUTH
    category: tokens
    regex: '(?i)\bbasic\s+(?P<secret>[A-Za-z0-9+/]{16,}={0,2})'
    base_confidence: 0.80
    entropy_weight: 0.3
    min_entropy: 3.0
    placeholder: BASIC_AUTH

  # --- Private keys ------------------------------------------------------
  - id: private_key_pem
    type: PRIVATE_KEY
    category: private_keys
    regex: '-----BEGIN (?:RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY(?: BLOCK)?-----[\s\S]{0,8000}?-----END (?:RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY(?: BLOCK)?-----'
    base_confidence: 0.99
    entropy_weight: 0.0
    placeholder: PRIVATE_KEY
    description: A PEM private key block is never a false positive.

  - id: private_key_header_only
    type: PRIVATE_KEY
    category: private_keys
    regex: '-----BEGIN (?:RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY(?: BLOCK)?-----'
    base_confidence: 0.90
    entropy_weight: 0.0
    placeholder: PRIVATE_KEY
    description: Truncated or pasted-without-footer private key.

  # --- Connection strings -----------------------------------------------
  - id: database_uri_credentials
    type: DATABASE_CREDENTIAL
    category: database_credentials
    regex: '\b(?:postgres|postgresql|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss|amqp|amqps|mssql|clickhouse|cockroachdb)://[^\s:/@]+:(?P<secret>[^\s@/]+)@[A-Za-z0-9._\-]+(?::\d+)?(?:/[^\s"''<>,;]*)?'
    base_confidence: 0.97
    entropy_weight: 0.0
    placeholder: DB_URI
    validator: not_placeholder_password
    description: >
      Connection string with an embedded password. The whole URI is redacted,
      not just the password, because the host and database name are themselves
      infrastructure disclosure.

  - id: generic_uri_credentials
    type: URI_CREDENTIAL
    category: database_credentials
    regex: '\b(?:ftp|sftp|ssh|smb|ldap|ldaps|https?)://[^\s:/@]+:(?P<secret>[^\s@/]{3,})@[A-Za-z0-9._\-]+(?::\d+)?(?:/[^\s"''<>,;]*)?'
    base_confidence: 0.85
    entropy_weight: 0.2
    placeholder: URI_CREDENTIAL
    validator: not_placeholder_password

  # --- Contextual assignment (lowest precedence) ------------------------
  - id: generic_secret_assignment
    type: GENERIC_SECRET
    category: generic_credentials
    regex: '(?i)\b(?:api[_\-]?key|apikey|secret[_\-]?key|access[_\-]?token|auth[_\-]?token|client[_\-]?secret|password|passwd|pwd)["'']?\s*[:=]\s*["'']?(?P<secret>[A-Za-z0-9_\-./+=]{12,})'
    base_confidence: 0.55
    entropy_weight: 0.8
    min_entropy: 3.0
    placeholder: SECRET
    validator: not_placeholder_password
    description: >
      A secret-looking assignment. Deliberately low confidence -- this is the
      pattern most likely to fire on documentation and test fixtures, so it
      leans hard on entropy and the placeholder validator.

# Values that look like credentials but are obviously not real. Used by the
# not_placeholder_password validator.
#
# Note: AWS's documented example key AKIAIOSFODNN7EXAMPLE is NOT excluded.
# It matches the aws_access_key prefix rule and should be detected -- treating
# a real-format key as safe because it says EXAMPLE is exactly the reasoning
# that leaks production keys.
placeholder_values:
  - password
  - passwd
  - changeme
  - your_password
  - your-password
  - yourpassword
  - your_api_key
  - your-api-key
  - your_secret
  - placeholder
  - example
  - dummy
  - redacted
  - xxxxxxxx
  - '********'
  - none
  - null
  - undefined
  - test
  - testing
  - secret
  - mysecret
  - hunter2
  - foobar
  - insert_key_here
  - replace_me
  - todo
